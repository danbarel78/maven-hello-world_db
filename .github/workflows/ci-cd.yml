name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: dbareldocker78/hello_world_db

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compute release version
        id: version
        run: |
          chmod +x scripts/version.sh
          VERSION=$(scripts/version.sh "${GITHUB_RUN_NUMBER}")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Build with Maven
        run: |
          mvn -f myapp/pom.xml clean package

      - name: Package versioned artifact
        run: |
          cp "myapp/target/myapp-1.0-SNAPSHOT.jar" "myapp/target/myapp-${{ steps.version.outputs.VERSION }}.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-${{ steps.version.outputs.VERSION }}
          path: myapp/target/myapp-${{ steps.version.outputs.VERSION }}.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: myapp
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            JAR_FILE=target/myapp-${{ steps.version.outputs.VERSION }}.jar

      - name: Summary
        run: |
          echo "## CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** myapp-${{ steps.version.outputs.VERSION }}.jar" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docker image:** ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"

  verify-image:
    name: Download and run the published image
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from Docker Hub
        run: docker pull "${IMAGE_NAME}:${{ needs.build-and-push.outputs.VERSION }}"

      - name: Run image and verify output
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:${{ needs.build-and-push.outputs.VERSION }}"
          output="$(docker run --rm "$IMAGE")"
          printf '%s\n' "$output"
          grep -q 'Hello World!' <<<"$output" || { echo "::error::missing 'Hello World!' in container output"; exit 1; }
          grep -qF 'My Name is Daniel Barel' <<<"$output" || { echo "::error::missing name line in container output"; exit 1; }
          {
            echo "### Image verification"
            echo "- Pulled: \`$IMAGE\`"
            echo "- Container output verified"
          } >> "$GITHUB_STEP_SUMMARY"
